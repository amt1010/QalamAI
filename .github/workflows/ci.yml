name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    name: Backend (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Each check runs even if an earlier one fails, so a single CI run
      # reports every problem instead of one per push.
      - name: Lint
        if: '!cancelled()'
        run: ruff check .

      - name: Format
        if: '!cancelled()'
        run: ruff format --check .

      - name: Type check
        if: '!cancelled()'
        run: mypy

      - name: Architecture boundaries
        if: '!cancelled()'
        run: lint-imports

      - name: Tests
        if: '!cancelled()'
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
