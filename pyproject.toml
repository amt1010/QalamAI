[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qalam"
version = "0.1.0"
description = "QalamAI — AI-powered Heritage Intelligence Platform for historical inscriptions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Ashish Mani Tripathi", email = "ashishmanitripathi@gmail.com" }]

# Upper bounds are deliberate. This platform will grow heavy CV/ML
# dependencies whose transitive resolution is fragile; unbounded ranges make
# builds non-reproducible. See ADR-0002.
dependencies = [
  "fastapi>=0.115,<0.117",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.32,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "import-linter>=2.1,<3.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<0.16",
]

[project.urls]
Documentation = "./docs"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/qalam"]

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: fast, isolated tests with no I/O",
  "integration: exercises multiple modules or real adapters",
  "regression: pins previously-fixed behaviour",
  "architecture: fitness functions that enforce module boundaries",
  "benchmark: measures performance; excluded from the default run",
]

[tool.coverage.run]
source = ["backend/src/qalam"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # comprehensions
  "SIM",       # simplify
  "ARG",       # unused arguments
  "PTH",       # prefer pathlib
  "BLE",       # blind except
  "RUF",
]
ignore = [
  "B008",  # FastAPI's Depends() in defaults is idiomatic

  # Ambiguous-Unicode ("confusables") checks. This platform's subject matter is
  # non-Latin script: Arabic, Persian, Hebrew, Greek, Brahmi, Cuneiform and
  # more appear as literals in normalization tables, tests, and fixtures. The
  # rule fires on essentially every one of them and would push the project
  # toward escape sequences, making the orthographic rules unreadable to the
  # philologists who must review them. Correctness here is protected by tests,
  # not by restricting the alphabet.
  "RUF001",  # ambiguous character in a string
  "RUF002",  # ambiguous character in a docstring
  "RUF003",  # ambiguous character in a comment
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ARG"]  # fixtures are often injected but unused by name

# ---------------------------------------------------------------------------
# Type checking — strict by default. Strong typing is a stated principle.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "backend/src"
packages = ["qalam"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# Architectural boundary enforcement — see ADR-0001.
# The modular monolith only stays modular if the layering is machine-checked.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["qalam"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layering"
type = "layers"
layers = [
  "qalam.api",
  "qalam.composition",
  "qalam.adapters",
  "qalam.application",
  "qalam.plugins",
  "qalam.domain",
  "qalam.core",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-agnostic"
type = "forbidden"
source_modules = ["qalam.domain"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "httpx"]

[[tool.importlinter.contracts]]
name = "Civilization plugins are mutually independent"
type = "independence"
modules = ["qalam.plugins.islamic_epigraphy"]
